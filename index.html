<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Studio — motion design dans le navigateur</title>
  <meta name="description" content="Éditeur de motion design temps réel : timeline, 150+ effets, 60+ transitions, keyframes, export MP4 et pilotage complet par IA (MCP).">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23050505'/%3E%3Cpath d='M4 18 L9 6 L12 13 L15 6 L20 18' fill='none' stroke='%2324D26D' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/timeline.css">
  <script src="vendor/lottie_canvas.min.js" defer></script>
</head>
<body>
  <a class="sr-only" href="#viewport">Aller au viewport</a>
  <div id="app">
    <header id="topbar" role="banner"></header>
    <main id="workspace">
      <aside id="left" class="panel" aria-label="Bibliothèque"></aside>
      <div id="split-left" class="splitter v" role="separator" aria-orientation="vertical" aria-label="Redimensionner la bibliothèque"></div>
      <section id="center" aria-label="Viewport">
        <div class="mobile-banner" role="note">Écran étroit : panneaux repliables (boutons ☰ et ⚙). Pour l'export lourd, un ordinateur de bureau est recommandé.</div>
      </section>
      <div id="split-right" class="splitter v" role="separator" aria-orientation="vertical" aria-label="Redimensionner l'inspecteur"></div>
      <aside id="right" class="panel" aria-label="Inspecteur et panneaux"></aside>
    </main>
    <div id="hsplit" class="splitter h" role="separator" aria-orientation="horizontal" aria-label="Redimensionner la timeline"></div>
    <section id="transport" aria-label="Transport"></section>
    <section id="timeline" aria-label="Timeline"></section>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">Motion Studio nécessite JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
