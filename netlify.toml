# Motion Studio — déploiement Netlify (site statique + Functions + Blobs)
[build]
  publish = "."
  # Aucun bundler requis pour le site ; les templates et PARITY.md sont pré-générés (npm run build:templates / build:parity).
  command = "echo 'Site statique prêt'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # les fonctions importent le cœur partagé (js/core, js/catalog, js/templates) : esbuild l'embarque automatiquement

# Isolation cross-origin (SharedArrayBuffer pour ffmpeg.wasm) + sécurité
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/ffmpeg-core/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# Pages
[[redirects]]
  from = "/parity"
  to = "/parity.html"
  status = 200

# Les fonctions déclarent leurs routes (config.path) : /mcp, /api/session, /api/share.
# Repli SPA : toute autre route renvoie l'application.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
